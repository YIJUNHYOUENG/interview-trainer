<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개발자 면접 트레이너 화면 와이어프레임</title>
<style>
  :root {
    --ink: #1f2937; --mut: #6b7280; --line: #d6d9de; --bg: #f1f3f6;
    --acc: #2f6fdb; --accbg: #e8f0fd; --ok: #2e8b57; --okbg: #eaf6ef;
    --warn: #c77d00; --bad: #d64545; --badbg: #fbeaea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  header.page { padding: 28px 32px 8px; max-width: 1280px; margin: 0 auto; }
  header.page h1 { margin: 0 0 6px; font-size: 22px; }
  header.page p { margin: 0; color: var(--mut); font-size: 13px; line-height: 1.6; }
  section.group { max-width: 1280px; margin: 0 auto; padding: 24px 32px 8px; }
  section.group > h2 { font-size: 15px; margin: 0 0 16px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
  .grid { display: flex; flex-wrap: wrap; gap: 36px 28px; align-items: flex-start; }
  figure { margin: 0; width: 320px; }
  figcaption { margin-top: 10px; font-size: 12px; line-height: 1.55; color: var(--mut); }
  figcaption b { display: block; color: var(--ink); font-size: 13px; }

  .phone { width: 320px; min-height: 620px; background: #fff; border: 2px solid #9aa1ab; border-radius: 26px;
           overflow: hidden; display: flex; flex-direction: column; font-size: 13px; }
  .status { height: 22px; padding: 6px 16px 0; font-size: 10px; color: var(--mut); display: flex; justify-content: space-between; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
  .bar .sp { flex: 1; }
  .bar .back { color: var(--mut); font-weight: 400; }
  .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .foot > * { flex: 1; }

  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; }
  .card.acc { background: var(--accbg); border-color: #b9d0f5; }
  .card.ok { background: var(--okbg); border-color: #b5dcc4; }
  .card.bad { background: var(--badbg); border-color: #efc0c0; }
  .h { font-size: 11px; color: var(--mut); font-weight: 700; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row.top { align-items: flex-start; }
  .row.between { justify-content: space-between; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grow { flex: 1; }
  .mut { color: var(--mut); } .sm { font-size: 11px; } .b { font-weight: 700; }
  .big { font-size: 22px; font-weight: 700; }
  .ok-t { color: var(--ok); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); } .acc-t { color: var(--acc); }

  .chips { display: flex; gap: 6px; overflow: hidden; mask-image: linear-gradient(to right, #000 85%, transparent); }
  .chips.wrap { flex-wrap: wrap; mask-image: none; }
  .chip { border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: 11px; white-space: nowrap; background: #fff; }
  .chip.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  .chip.ok { background: var(--okbg); border-color: #b5dcc4; color: var(--ok); }
  .chip.bad { background: var(--badbg); border-color: #efc0c0; color: var(--bad); }

  .btn { border: 1px solid var(--line); border-radius: 8px; padding: 9px; text-align: center; font-weight: 700; background: #fff; }
  .btn.p { background: var(--acc); color: #fff; border-color: var(--acc); }
  .btn.sm { padding: 5px 10px; font-size: 11px; }
  .btn.dis { color: #aab0b8; background: #f4f5f7; }
  .input { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: #9aa1ab; background: #fff; }
  .input.area { min-height: 64px; }
  .input.filled { color: var(--ink); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg > div { flex: 1; text-align: center; padding: 7px 4px; font-size: 12px; color: var(--mut); }
  .seg > div.on { background: var(--acc); color: #fff; font-weight: 700; }

  .ln { height: 7px; border-radius: 4px; background: #e5e7eb; }
  .ln.s { width: 60%; } .ln.m { width: 82%; }
  .track { height: 8px; background: #e5e7eb; border-radius: 4px; position: relative; overflow: hidden; }
  .fill { height: 100%; background: var(--acc); border-radius: 4px; }
  .zone { position: absolute; top: 0; bottom: 0; background: #cfe8d9; }
  .mk { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--ink); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab { flex: 1; text-align: center; padding: 9px 4px; color: var(--mut); }
  .tab.on { color: var(--acc); border-bottom: 2px solid var(--acc); font-weight: 700; }
  .opt { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: flex; gap: 8px; }
  .opt.ok { border-color: var(--ok); background: var(--okbg); }
  .opt.no { border-color: var(--bad); background: var(--badbg); }
  .opt i { font-style: normal; font-weight: 700; color: var(--mut); }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
  .ico { width: 30px; height: 30px; border-radius: 8px; background: var(--accbg); border: 1px solid #b9d0f5; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .dot.off { background: var(--bad); }
  .bubble { max-width: 84%; padding: 8px 10px; border-radius: 12px; font-size: 12px; line-height: 1.5; }
  .bubble.l { background: #eef0f3; align-self: flex-start; }
  .bubble.r { background: var(--accbg); align-self: flex-end; }
  .score { min-width: 40px; text-align: center; border-radius: 8px; padding: 4px 6px; font-weight: 700; background: var(--accbg); color: var(--acc); }
  .ring { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; flex: none;
          background: conic-gradient(var(--acc) 0 78%, #e5e7eb 0); }
  .ring > div { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; line-height: 1.1; }
  .wave { display: flex; align-items: center; justify-content: center; gap: 3px; height: 34px; }
  .wave span { width: 4px; background: var(--acc); border-radius: 2px; }
  .mic { width: 56px; height: 56px; border-radius: 50%; background: var(--bad); margin: 0 auto; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 54px; }
  .bars span { flex: 1; background: #b9d0f5; border-radius: 3px 3px 0 0; }
  .dim { position: relative; }
  .dim::after { content: ""; position: absolute; inset: 0; background: rgba(31,41,55,.35); }
  .dialog { position: absolute; left: 24px; right: 24px; top: 40%; z-index: 2; background: #fff; border-radius: 12px; padding: 14px; border: 1px solid var(--line); }
</style>
</head>
<body>

<header class="page">
  <h1>개발자 면접 트레이너 — 화면 와이어프레임</h1>
  <p>360dp 폭 세로 화면 기준 스케치다. 모양보다 <b>어떤 요소가 어디에 있고 어디로 이동하는지</b>를 보여 주는 용도이며, 동작과 상태 설명은 <code>SCREENS.md</code> 에 있다.
     파랑 = 선택·주요 버튼, 초록 = 정답·좋음, 빨강 = 오답·개선 필요.</p>
</header>

<!-- ============================ 공통 ============================ -->
<section class="group">
  <h2>공통</h2>
  <div class="grid">

    <!-- 1. 홈 -->
    <figure>
      <div class="phone">
        <div class="status"><span>9:41</span><span>● ● ●</span></div>
        <div class="bar"><span class="grow">개발자 면접 트레이너</span><span class="sm mut b"><span class="dot"></span> 서버 연결됨</span></div>
        <div class="body">
          <div class="row">
            <div class="card acc grow col" style="min-height:104px">
              <div class="ico"></div><div class="b">CS 개념 학습</div><div class="sm mut">60개 개념 · 평균 Lv.2.4</div>
            </div>
            <div class="card acc grow col" style="min-height:104px">
              <div class="ico"></div><div class="b">AI 모의 면접</div><div class="sm mut">지원 정보 설정 · 면접 시작</div>
            </div>
          </div>

          <div class="h" style="margin-top:4px">내 학습 현황</div>

          <div class="card">
            <div class="row between"><span class="b">오늘의 퀴즈</span><span class="chip bad">아직 안 풀었어요</span></div>
            <div class="row" style="margin-top:8px"><span class="mut">○ ○ ○</span><span class="sm mut grow">3문제 · 약 2분</span><span class="btn p sm">풀기</span></div>
          </div>

          <div class="row">
            <div class="card grow">
              <div class="h">오답노트</div>
              <div class="big bad-t">7<span class="sm mut b"> 개</span></div>
              <div class="sm mut">풀어야 할 오답 ›</div>
            </div>
            <div class="card grow">
              <div class="h">오늘 복습</div>
              <div class="big">4<span class="sm mut b"> 개념</span></div>
              <div class="sm mut">복습일이 된 개념 ›</div>
            </div>
          </div>

          <div class="card">
            <div class="row between"><span class="b">면접 히스토리</span><span class="sm mut">총 5회 ›</span></div>
            <div class="row" style="margin-top:6px">
              <div><div class="big acc-t">78<span class="sm mut b"> 점</span></div><div class="sm mut">최근 · 3일 전</div></div>
              <svg class="grow" viewBox="0 0 120 40" height="40"><polyline fill="none" stroke="#2f6fdb" stroke-width="2" points="4,32 34,26 64,28 94,16 116,10"/><circle cx="116" cy="10" r="3" fill="#2f6fdb"/></svg>
            </div>
          </div>
        </div>
      </div>
      <figcaption><b>1. 홈</b>CS 개념 학습 / AI 모의 면접 두 카드로 영역 진입. 아래는 통계 카드(퀴즈 → 퀴즈, 오답 → 오답노트, 복습 → 목록 "오늘 복습", 히스토리 → 면접 히스토리).</figcaption>
    </figure>

  </div>
</section>

<!-- ============================ CS 학습 ============================ -->
<section class="group">
  <h2>CS 개념 학습</h2>
  <div class="grid">

    <!-- 2. 목록 -->
    <figure>
      <div class="phone">
        <div class="status"><span>9:41</span><span>● ● ●</span></div>
        <div class="bar"><span class="back">‹</span><span class="grow">CS 개념 학습</span></div>
        <div class="body">
          <div class="row">
            <div class="btn p grow">오늘의 퀴즈 <span class="sm">(3)</span></div>
            <div class="btn grow">오답노트 <span class="sm bad-t">(7)</span></div>
          </div>
          <div class="h">카테고리</div>
          <div class="chips">
            <span class="chip">전체</span><span class="chip">오늘 복습 4</span><span class="chip">자료구조</span><span class="chip">알고리즘</span>
            <span class="chip on">운영체제</span><span class="chip">네트워크</span><span class="chip">DB</span><span class="chip">Java/Kotlin</span>
          </div>
          <div class="row between"><span class="b">운영체제 <span class="mut b">6</span></span><span class="sm mut">정렬: 기본순 ▾</span></div>

          <div class="item">
            <div class="row between"><span class="b">프로세스와 스레드</span><span class="chip bad">복습 오늘</span></div>
            <div class="sm mut">실행 단위의 차이와 메모리 공유 방식</div>
            <div class="row"><span class="warn-t">★★☆☆☆</span><span class="sm mut">Lv.2</span><div class="track grow"><div class="fill" style="width:40%"></div></div></div>
          </div>
          <div class="item">
            <div class="row between"><span class="b">데드락</span><span class="sm mut">3일 뒤</span></div>
            <div class="sm mut">발생 조건 4가지와 해결 방법</div>
            <div class="row"><span class="warn-t">★★★☆☆</span><span class="sm mut">Lv.3</span><div class="track grow"><div class="fill" style="width:60%"></div></div></div>
          </div>
          <div class="item">
            <div class="row between"><span class="b">가상 메모리</span><span class="sm mut">아직 안 봄</span></div>
            <div class="sm mut">페이지 교체와 주소 변환</div>
            <div class="row"><span class="mut">☆☆☆☆☆</span><span class="sm mut">미학습</span><div class="track grow"></div></div>
          </div>
          <div class="item"><div class="b">컨텍스트 스위칭</div><div class="ln m"></div></div>
        </div>
      </div>
      <figcaption><b>2. CS 개념 학습 — 목록</b>10개 카테고리 + "전체", "오늘 복습" 필터 칩(가로 스크롤). 칩을 고르면 목록만 바뀐다. 항목 탭 → 상세.</figcaption>
    </figure>

    <!-- 3. 상세 -->
    <figure>
      <div class="phone">
        <div class="status"><span>9:41</span><span>● ● ●</span></div>
        <div class="bar"><span class="back">‹</span><span class="grow">프로세스와 스레드</span></div>
        <div class="body">
          <div class="row"><span class="chip">운영체제</span><span class="warn-t">★★☆☆☆</span><span class="sm mut">Lv.2 · 다음 복습 오늘</span></div>
          <div class="card acc"><div class="h">한 줄 요약</div>프로세스는 독립된 메모리를 가진 실행 단위, 스레드는 프로세스 안에서 메모리를 공유하는 실행 흐름이다.</div>
          <div class="chips wrap"><span class="chip">PCB</span><span class="chip">컨텍스트 스위칭</span><span class="chip">공유 메모리</span><span class="chip">동기화</span></div>

          <div class="h">설명</div>
          <div class="col"><div class="ln"></div><div class="ln"></div><div class="ln m"></div><div class="ln"></div><div class="ln s"></div></div>

          <div class="h" style="margin-top:4px">면접 단골 질문</div>
          <div class="card">
            <div class="row between"><span class="b">Q1. 프로세스와 스레드의 차이는?</span><span class="mut">⌃</span></div>
            <div class="card ok" style="margin-top:8px"><div class="h ok-t">모범 답안 예시</div>
              <div class="col" style="margin-top:4px"><div class="ln"></div><div class="ln"></div><div class="ln m"></div></div></div>
          </div>
          <div class="card row between"><span class="b">Q2. 멀티스레드의 단점은?</span><span class="mut">⌄</span></div>
        </div>
        <div class="foot"><div class="btn">‹ 이전 개념</div><div class="btn">다음 개념 ›</div></div>
      </div>
      <figcaption><b>3. CS 개념 학습 — 상세</b>요약 → 키워드 → 설명 → 단골 질문(탭하면 모범 답안 펼침). 하단에서 같은 카테고리의 이전/다음 개념으로 이동. 질문과 모범 답안은 개념당 2개.</figcaption>
    </figure>

    <!-- 4a. 퀴즈 진행 -->
    <figure>
      <div class="phone">
        <div class="status"><span>9:41</span><span>● ● ●</span></div>
        <div class="bar"><span class="back">✕</span><span class="grow">오늘의 퀴즈</span><span class="sm mut b">2 / 3</span></div>
        <div class="body">
          <div class="row"><div class="track grow"><div class="fill" style="width:66%"></div></div></div>
          <div class="row"><span class="chip">네트워크</span><span class="sm mut">TCP 와 UDP</span></div>
          <div class="b" style="font-size:15px;line-height:1.5">TCP 가 연결 설정에 사용하는 절차로 알맞은 것은?</div>
          <div class="opt"><i>1</i><span>2-way handshake</span></div>
          <div class="opt no"><i>2</i><span>4-way handshake</span><span class="grow"></span><span class="bad-t b">✕ 내 선택</span></div>
          <div class="opt ok"><i>3</i><span>3-way handshake</span><span class="grow"></span><span class="ok-t b">✓ 정답</span></div>
          <div class="opt"><i>4</i><span>Slow start</span></div>
          <div class="card"><div class="h">해설</div>
            <div class="col" style="margin-top:4px"><div class="ln"></div><div class="ln m"></div></div></div>
        </div>
        <div class="foot"><div class="btn p">다음 문제</div></div>
      </div>
      <figcaption><b>4. 퀴즈 — 문제 풀이</b>보기를 고르면 즉시 정답·오답·해설 표시(고른 뒤에는 변경 불가). 마지막 문제의 버튼은 "결과 보기". ✕ 는 중단 확인 후 홈으로.</figcaption>
    </figure>

    <!-- 4b. 퀴즈 결과 -->
    <figure>
      <div class="phone">
        <div class="status"><span>9:41</span><span>● ● ●</span></div>
        <div class="bar"><span class="grow">퀴즈 결과</span></div>
        <div class="body">
          <div class="card acc" style="text-align:center">
            <div class="h">오늘의 퀴즈 완료</div>
            <div class="big" style="font-size:34px">2 <span class="mut">/ 3</span></div>
            <div class="sm mut">내일 새 퀴즈가 열려요</div>
          </div>
          <div class="h">문제별 결과</div>
          <div class="item"><div class="row between"><span class="b ok-t">✓ 프로세스와 스레드</span><span class="chip ok">Lv.2 → 3</span></div><div class="sm mut">다음 복습: 4일 뒤</div></div>
          <div class="item"><div class="row between"><span class="b bad-t">✕ TCP 와 UDP</span><span class="chip bad">Lv.3 → 2</span></div><div class="sm mut">다음 복습: 2일 뒤 · 오답노트에 추가됨</div></div>
          <div class="item"><div class="row between"><span class="b ok-t">✓ 인덱스</span><span class="chip ok">Lv.1 → 2</span></div><div class="sm mut">다음 복습: 2일 뒤</div></div>
        </div>
        <div class="foot"><div class="btn">오답노트 보기</div><div class="btn p">홈으로</div></div>
      </div>
      <figcaption><b>4. 퀴즈 — 결과</b>점수, 문제별 정오와 숙련도 변화, 다음 복습일. 오늘 이미 풀었다면 퀴즈 진입 시 이 화면이 바로 열린다("오늘 완료").</figcaption>
    </figure>

    <!-- 5. 오답노트 -->
    <figure>
      <div class="phone">
        <div class="status"><span>9:41</span><span>● ● ●</span></div>
        <div class="bar"><span class="back">‹</span><span class="grow">오답노트</span></div>
        <div class="body">
          <div class="seg"><div class="on">풀어야 할 것 7</div><div>해결함 12</div></div>
          <div class="chips"><span class="chip on">전체</span><span class="chip">자료구조</span><span class="chip">운영체제</span><span class="chip">네트워크</span><span class="chip">DB</span></div>

          <div class="item">
            <div class="row between"><span class="chip">네트워크</span><span class="sm mut">2회 틀림</span></div>
